name: azure-static-web-apps
# Deploys the web demo (web/) and its API (api/, managed Azure Functions) to Azure Static
# Web Apps, Free plan. Needs the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN
# (the deployment token of the Static Web App). Until that secret exists, this workflow
# skips the deploy and stays green. Setup steps: web/README.md.
on:
  push:
    branches: [main]
    paths: ["web/**", "api/**", "src/**", "data/**", "scripts/build-api.mjs", ".github/workflows/azure-static-web-apps.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swa-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - name: Skip until the Static Web App exists
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::notice title=Web demo not deployed::Add the AZURE_STATIC_WEB_APPS_API_TOKEN repository secret to deploy (see web/README.md)."
          echo "Web demo not deployed: add the **AZURE_STATIC_WEB_APPS_API_TOKEN** repository secret (see web/README.md)." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22

      - name: Build API lib + tests
        if: env.HAS_TOKEN == 'true'
        run: |
          node scripts/build-api.mjs
          npm test

      - name: Deploy to Azure Static Web Apps
        id: swa
        if: env.HAS_TOKEN == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web
          api_location: api
          output_location: ""
          skip_app_build: true

      - name: Smoke test
        if: env.HAS_TOKEN == 'true'
        env:
          SITE: ${{ steps.swa.outputs.static_web_app_url }}
        run: |
          echo "Site: $SITE"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$SITE/api/health" -o health.json; then break; fi
            sleep 15
          done
          cat health.json || true
          {
            echo "## Web demo deployed"
            echo
            echo "$SITE"
            echo
            echo '```json'; cat health.json || echo "health check failed"; echo; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
